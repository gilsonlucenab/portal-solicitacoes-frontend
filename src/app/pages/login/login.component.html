<div class="login-container">

  <div class="login-card">

    <h1>Portal de Solicitações</h1>

    <p class="subtitulo">
      Acesse sua conta
    </p>

    <form (ngSubmit)="login()">

      <div class="campo">
        <label for="username">
          Usuário
        </label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Digite seu usuário"
          required
        />
      </div>

      <div class="campo">
        <label for="password">
          Senha
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Digite sua senha"
          required
        />
      </div>

      <p
        class="erro"
        *ngIf="erro"
      >
        {{ erro }}
      </p>

      <button
        type="submit"
        [disabled]="carregando"
      >
        {{ carregando ? 'Entrando...' : 'Entrar' }}
      </button>

    </form>

  </div>

</div>
